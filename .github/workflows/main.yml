name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev readline-common libreadline-dev libffi-dev libgl1-mesa-dev libgles2-mesa-dev zip unzip git
        python -m pip install --upgrade pip setuptools
        pip install cython==0.29.33 buildozer python-for-android

    - name: Initialize and Accept Licenses
      run: |
        buildozer init
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,sympy/' buildozer.spec
        # Forzo la versione delle build-tools stabile per evitare la v37 sperimentale
        sed -i 's/# android.build_tools_version = 28.0.3/android.build_tools_version = 33.0.2/' buildozer.spec
        sed -i 's/# android.api = 31/android.api = 33/' buildozer.spec
        
    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: bin/*.apk
